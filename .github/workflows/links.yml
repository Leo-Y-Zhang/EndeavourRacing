name: Outbound links

# Deliberately not on push. The website links to thirteen sponsors, partners and
# the competition organisers; whether their servers are up says nothing about
# the commit being pushed, and a red build must mean something is wrong here.
# Weekly instead, so a sponsor's site going dark is noticed within a week rather
# than by a visitor.
on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

# Least privilege: these jobs only ever read the checkout. Declared
# explicitly so the workflow keeps its own floor even if the repository
# default token permission is widened later.
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: python tools/check_pages.py --links
